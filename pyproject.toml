[project]
name = "speak-helper"
version = "0.0.1"
description = "Desktop clipboard & hotkey text-to-speech (TTS) assistant with OCR — read aloud, Edge TTS, OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Speak Helper contributors" }]
keywords = [
    "text-to-speech",
    "tts",
    "read-aloud",
    "clipboard",
    "accessibility",
    "ocr",
    "edge-tts",
    "openai-tts",
    "pyside6",
    "desktop-app",
    "hotkey",
    "文字转语音",
    "朗读",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "pynput>=1.7.6",
    "platformdirs>=4.2.0",
    "keyring>=25.0.0",
    "edge-tts>=7.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
speak-helper = "speak_helper.main:main"

[project.urls]
Homepage = "https://github.com/archoor/speak-helper"
Documentation = "https://github.com/archoor/speak-helper/tree/main/docs"
Repository = "https://github.com/archoor/speak-helper"
Issues = "https://github.com/archoor/speak-helper/issues"
Changelog = "https://github.com/archoor/speak-helper/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speak_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
